---
# Install and configure sudo
- name: sudo | install sudo
  community.general.pacman:
    name: sudo
    state: present
  become: true

- name: sudo | add user to groups
  ansible.builtin.user:
    name: "{{ user.name }}"
    groups: "{{ item }}"
    append: yes
  with_items:
    - wheel
    - storage
    - power
  become: true

- name: sudo | ensure removal of sudoers drop-in from template creation
  ansible.builtin.file:
    path: /etc/sudoers.d/allow-group-wheel
    state: absent
  become: true

- name: sudo | copy wheel sudoers drop-in
  ansible.builtin.template:
    src: 00-custom-sudoers-wheel.j2
    dest: /etc/sudoers.d/00-allow-wheel
    mode: 0600
    validate: "visudo -cf %s"
  become: true
